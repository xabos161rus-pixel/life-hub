<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LifeHearth">
  <!-- Знак LifeHearth: дом внутри пламени. Снаружи очаг, внутри то, ради чего
       очаг существует. Прямое прочтение названия, и при этом не «иконка огня»,
       которая есть в любом наборе.

       Правила, по которым он нарисован:
       — один силуэт и одна вложенная форма, больше ничего. Всё, что тоньше
         8px при 512, на реальных 60px на экране «Домой» исчезает;
       — углы НЕ скруглены: iOS и Android накладывают свою маску, и вшитое
         скругление даёт двойное с тёмными уголками;
       — фон той же парой цветов, что главная кнопка приложения. Прежняя
         иконка была оранжево-коричневой и с интерфейсом не рифмовалась вовсе;
       — пламя асимметрично: вершина уведена вбок, левый бок вогнут, правый
         выпуклый. Симметричная капля с острым верхом читается как вода. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5B62D6"/><stop offset="1" stop-color="#7C3FD0"/>
    </linearGradient>
    <linearGradient id="w" x1="0.35" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFD98A"/><stop offset="0.5" stop-color="#FFA93A"/><stop offset="1" stop-color="#FF6F2C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256,268) scale(1.12) translate(-256,-276)">
    <path d="M300 84
             C 300 150, 262 176, 236 208
             C 214 236, 210 260, 222 282
             C 200 274, 186 256, 184 232
             C 148 268, 128 312, 128 352
             C 128 420, 184 468, 256 468
             C 328 468, 384 420, 384 352
             C 384 296, 356 254, 330 222
             C 306 192, 296 140, 300 84 Z"
          fill="url(#w)"/>
    <g transform="translate(256,352) scale(0.78) translate(-256,-362)">
      <path d="M256 286
               C 262 286, 267 288, 271 292
               L 330 348
               C 335 353, 338 360, 338 367
               L 338 420
               C 338 430, 330 438, 320 438
               L 192 438
               C 182 438, 174 430, 174 420
               L 174 367
               C 174 360, 177 353, 182 348
               L 241 292
               C 245 288, 250 286, 256 286 Z"
            fill="#FFF4D6"/>
    </g>
  </g>
</svg>
